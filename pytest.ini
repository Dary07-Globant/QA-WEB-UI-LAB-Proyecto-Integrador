[pytest]
# Configuración de pytest + Allure
addopts = --alluredir=allure-results --clean-alluredir -v
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Pruebas de humo (flujo crítico mínimo)
    login: Pruebas del flujo de inicio de sesión
    regression: Pruebas de regresión
